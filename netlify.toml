[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/send-order"
  to = "/.netlify/functions/send-order"
  status = 200

[[redirects]]
  from = "/api/room-preview"
  to = "/.netlify/functions/room-preview"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
